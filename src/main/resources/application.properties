spring.application.name=viajes

spring.datasource.url=jdbc:mysql://localhost:3307/columbia_viajes
spring.datasource.username=root
spring.datasource.password=root1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# --- Spring Security + JWT ---
# Clave secreta para firmar los tokens JWT (HMAC-SHA256).
app.jwt.secret=${JWT_SECRET}
# Tiempo de expiraci\u00c3\u00b3n del token en milisegundos (24 horas = 86400000 ms)
app.jwt.expiration-ms=900000